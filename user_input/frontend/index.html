<!DOCTYPE html>
<html>
<head>
    <title>AI Music Input</title>
</head>

<body>

<h2>Describe your music</h2>

<input id="textInput" type="text" placeholder="dark cinematic piano music" size="40">
<button onclick="sendText()">Generate</button>

<p id="result"></p>

<script>

async function sendText() {

    const text = document.getElementById("textInput").value;

    const response = await fetch("/process", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            text: text
        })
    });

    const data = await response.json();

    document.getElementById("result").innerText =
        "Audio: " + data.audio_file + "\nPDF: " + data.pdf_file +
        "\nGenre: " + data.musical_features.genre +
        " | Mood: " + data.musical_features.mood +
        " | Tempo: " + data.musical_features.tempo + " BPM";

}

</script>

</body>
</html>
